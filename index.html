<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Monster Adventure</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
    <div id="game-container"></div>
    <div id="ui-overlay">
        <div id="minimap-container">
            <canvas id="minimap" width="150" height="150"></canvas>
        </div>
        <div id="battle-ui" class="hidden">
            <div class="battle-panel">
                <div class="enemy-info">
                    <div class="enemy-sprite"></div>
                    <div class="enemy-health-bar">
                        <div class="health-fill" id="enemy-health"></div>
                    </div>
                    <span id="enemy-name">Wild Monster</span>
                    <span id="enemy-level">Lv. 5</span>
                </div>
                <div class="player-info">
                    <div class="player-monster-sprite"></div>
                    <div class="player-health-bar">
                        <div class="health-fill" id="player-health"></div>
                    </div>
                    <span id="player-monster-name">Monster</span>
                    <span id="player-monster-level">Lv. 5</span>
                </div>
                <div class="battle-actions">
                    <button id="attack-btn" class="battle-btn">Attack</button>
                    <button id="catch-btn" class="battle-btn">Catch</button>
                    <button id="run-btn" class="battle-btn">Run</button>
                    <button id="use-item-btn" class="battle-btn">Use Item</button>
                </div>
                <div id="battle-log" class="battle-log"></div>
            </div>
        </div>
        <div id="menu-ui" class="hidden">
            <div class="menu-panel">
                <h2>Menu</h2>
                <div class="menu-section">
                    <h3>Monsters</h3>
                    <div id="monster-list" class="monster-list"></div>
                </div>
                <div class="menu-section">
                    <h3>Items</h3>
                    <div id="item-list" class="item-list"></div>
                </div>
                <button id="close-menu-btn">Close</button>
            </div>
        </div>
        <div id="encounter-notification" class="hidden">
            <span>Wild Monster appeared!</span>
        </div>
        <div id="player-stats">
            <span id="player-position">X: 0, Y: 0</span>
            <span id="player-zone">Zone: Grassland</span>
        </div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/world/WorldGenerator.js"></script>
    <script src="js/entities/Player.js"></script>
    <script src="js/entities/Monster.js"></script>
    <script src="js/systems/BattleSystem.js"></script>
    <script src="js/systems/EncounterSystem.js"></script>
    <script src="js/systems/Inventory.js"></script>
    <script src="js/ui/Minimap.js"></script>
    <script src="js/ui/UIManager.js"></script>
    <script src="js/scenes/BootScene.js"></script>
    <script src="js/scenes/WorldScene.js"></script>
    <script src="js/scenes/BattleScene.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
