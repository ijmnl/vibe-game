<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Pixel Monster Adventure</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
    <link rel="stylesheet" href="css/style.css">
    <script src="vendor/phaser.min.js"></script>
</head>
<body>
    <div id="game-container"></div>
    <div id="ui-overlay">
        <div id="minimap-container">
            <canvas id="minimap" width="150" height="150"></canvas>
        </div>
        <div id="player-stats">
            <span id="player-position">X: 0, Y: 0</span>
            <span id="player-zone">Zone: Grassland</span>
        </div>

        <div id="touch-controls" class="hidden">
            <div id="dpad">
                <button class="dpad-btn dpad-up" data-direction="up" aria-label="Up">▲</button>
                <button class="dpad-btn dpad-left" data-direction="left" aria-label="Left">◀</button>
                <button class="dpad-btn dpad-right" data-direction="right" aria-label="Right">▶</button>
                <button class="dpad-btn dpad-down" data-direction="down" aria-label="Down">▼</button>
            </div>
            <button id="menu-btn" class="action-btn" data-action="menu" aria-label="Menu">MENU</button>
        </div>

        <div id="battle-ui" class="hidden">
            <div class="battle-panel">
                <div class="combatants">
                    <div class="enemy-info">
                        <div class="monster-meta">
                            <span id="enemy-name">Wild Monster</span>
                            <span id="enemy-level">Lv. 5</span>
                        </div>
                        <div class="health-bar">
                            <div class="health-fill" id="enemy-health"></div>
                        </div>
                    </div>
                    <div class="player-info">
                        <div class="monster-meta">
                            <span id="player-monster-name">Monster</span>
                            <span id="player-monster-level">Lv. 5</span>
                        </div>
                        <div class="health-bar">
                            <div class="health-fill" id="player-health"></div>
                        </div>
                    </div>
                </div>
                <div id="battle-log" class="battle-log"></div>
                <div class="battle-actions">
                    <button id="attack-btn" class="battle-btn">Attack</button>
                    <button id="catch-btn" class="battle-btn">Catch</button>
                    <button id="run-btn" class="battle-btn">Run</button>
                    <button id="use-item-btn" class="battle-btn">Use Item</button>
                </div>
                <div id="battle-items" class="battle-items hidden">
                    <h3>Choose an item</h3>
                    <div id="battle-item-list" class="item-list"></div>
                    <button id="cancel-item-btn" class="battle-btn">Back</button>
                </div>
            </div>
        </div>

        <div id="menu-ui" class="hidden">
            <div class="menu-panel">
                <h2>Menu</h2>
                <div class="menu-section">
                    <h3>Monsters</h3>
                    <div id="monster-list" class="monster-list"></div>
                </div>
                <div class="menu-section">
                    <h3>Items</h3>
                    <div id="item-list" class="item-list"></div>
                </div>
                <button id="close-menu-btn">Close</button>
            </div>
        </div>

        <div id="encounter-notification" class="hidden">
            <span>Wild Monster appeared!</span>
        </div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/systems/AudioManager.js"></script>
    <script src="js/world/WorldGenerator.js"></script>
    <script src="js/world/TileTextures.js"></script>
    <script src="js/entities/Monster.js"></script>
    <script src="js/entities/Player.js"></script>
    <script src="js/systems/BattleSystem.js"></script>
    <script src="js/systems/EncounterSystem.js"></script>
    <script src="js/systems/Inventory.js"></script>
    <script src="js/ui/Minimap.js"></script>
    <script src="js/ui/TouchControls.js"></script>
    <script src="js/ui/UIManager.js"></script>
    <script src="js/scenes/BootScene.js"></script>
    <script src="js/scenes/WorldScene.js"></script>
    <script src="js/scenes/BattleScene.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
