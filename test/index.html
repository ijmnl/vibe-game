<!DOCTYPE html>
<html>
<head>
    <title>Pixel Monster Adventure - Test Runner</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #ffcc00;
            text-align: center;
        }
        .test-section {
            background: #2a2a3e;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            border-left: 4px solid #ffcc00;
        }
        .test-section h2 {
            margin-top: 0;
            color: #ffcc00;
        }
        .test-result {
            padding: 10px;
            margin: 5px 0;
            border-radius: 4px;
        }
        .pass {
            background: #2e8b57;
            color: #fff;
        }
        .fail {
            background: #ff4444;
            color: #fff;
        }
        .warn {
            background: #ffcc00;
            color: #000;
        }
        .info {
            background: #4a4a6a;
            color: #fff;
        }
        button {
            background: #ffcc00;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
        }
        button:hover {
            background: #ffdd44;
        }
        #game-frame {
            width: 100%;
            height: 500px;
            border: 2px solid #ffcc00;
            border-radius: 8px;
            margin: 20px 0;
        }
        .summary {
            background: #3a3a5a;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Pixel Monster Adventure - Test Report</h1>
        
        <div class="test-section">
            <h2>📊 Test Summary</h2>
            <div id="summary" class="summary">
                <p>Total Tests: <span id="total-tests">0</span></p>
                <p>Passed: <span id="passed-tests">0</span></p>
                <p>Failed: <span id="failed-tests">0</span></p>
                <p>Warnings: <span id="warning-tests">0</span></p>
            </div>
        </div>

        <div class="test-section">
            <h2>🔍 Core Functionality Tests</h2>
            <div id="core-tests"></div>
        </div>

        <div class="test-section">
            <h2>🌍 World Generation Tests</h2>
            <div id="world-tests"></div>
        </div>

        <div class="test-section">
            <h2>👾 Entity Tests</h2>
            <div id="entity-tests"></div>
        </div>

        <div class="test-section">
            <h2>⚔️ Battle System Tests</h2>
            <div id="battle-tests"></div>
        </div>

        <div class="test-section">
            <h2>🎒 Inventory Tests</h2>
            <div id="inventory-tests"></div>
        </div>

        <div class="test-section">
            <h2>🎨 UI Tests</h2>
            <div id="ui-tests"></div>
        </div>

        <div class="test-section">
            <h2>🎵 Audio Tests</h2>
            <div id="audio-tests"></div>
        </div>

        <div class="test-section">
            <h2>🐛 Known Issues</h2>
            <div id="known-issues"></div>
        </div>

        <div style="text-align: center; margin: 30px 0;">
            <button onclick="runAllTests()">Run All Tests</button>
            <button onclick="runGameTest()">Test Game in Frame</button>
        </div>

        <div style="display: none;">
            <iframe id="game-frame" src="../index.html"></iframe>
        </div>
    </div>

    <script>
        // Test results
        let testResults = {
            total: 0,
            passed: 0,
            failed: 0,
            warnings: 0,
            issues: []
        };

        // DOM elements
        const totalTestsEl = document.getElementById('total-tests');
        const passedTestsEl = document.getElementById('passed-tests');
        const failedTestsEl = document.getElementById('failed-tests');
        const warningTestsEl = document.getElementById('warning-tests');

        // Section the next results are appended to
        let currentSection = null;

        function addResult(message, type = 'info') {
            testResults.total++;

            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.textContent = message;

            if (currentSection) {
                currentSection.appendChild(div);
            }
            
            switch(type) {
                case 'pass':
                    testResults.passed++;
                    break;
                case 'fail':
                    testResults.failed++;
                    testResults.issues.push(message);
                    break;
                case 'warn':
                    testResults.warnings++;
                    testResults.issues.push(message);
                    break;
            }
            
            updateSummary();
            return div;
        }

        function updateSummary() {
            totalTestsEl.textContent = testResults.total;
            passedTestsEl.textContent = testResults.passed;
            failedTestsEl.textContent = testResults.failed;
            warningTestsEl.textContent = testResults.warnings;
        }

        function runTest(name, testFn) {
            try {
                const result = testFn();
                if (result === true) {
                    return addResult(`✅ ${name}`, 'pass');
                } else if (typeof result === 'string') {
                    return addResult(`⚠️ ${name}: ${result}`, 'warn');
                } else {
                    return addResult(`✅ ${name}`, 'pass');
                }
            } catch (e) {
                return addResult(`❌ ${name}: ${e.message}`, 'fail');
            }
        }

        // Core Tests
        function testCore() {
            currentSection = document.getElementById('core-tests');
            
            runTest('CONFIG object exists', () => {
                if (typeof CONFIG === 'undefined') throw new Error('CONFIG not loaded');
                return true;
            });
            
            runTest('CONFIG has all required properties', () => {
                const required = ['GAME_WIDTH', 'GAME_HEIGHT', 'TILE_SIZE', 'WORLD_WIDTH', 'WORLD_HEIGHT', 'ZONES'];
                for (const prop of required) {
                    if (!(prop in CONFIG)) return `Missing property: ${prop}`;
                }
                return true;
            });
            
            runTest('Zones are properly defined', () => {
                const zones = CONFIG.ZONES;
                const requiredZones = ['GRASS', 'FOREST', 'WATER', 'CAVE', 'SAND'];
                for (const zone of requiredZones) {
                    if (!(zone in zones)) return `Missing zone: ${zone}`;
                }
                return true;
            });
            
            runTest('Helper functions exist', () => {
                ['getRandomMonsterForZone', 'getSpecies', 'getMove', 'getMovesForLevel',
                 'getTypeMultiplier', 'getMapDef'].forEach(name => {
                    if (typeof window[name] !== 'function') throw new Error(`${name} missing`);
                });
                return true;
            });

            runTest('Every species is complete and self-consistent', () => {
                DEX_ORDER.forEach(name => {
                    const species = getSpecies(name);
                    if (!TYPES.includes(species.type)) return `${name} has an unknown type`;
                    if (!species.moves.length) return `${name} has no moves`;
                    species.moves.forEach(([, move]) => {
                        if (!MOVES[move]) throw new Error(`${name} learns unknown move ${move}`);
                    });
                    if (species.evolvesTo && !SPECIES[species.evolvesTo]) {
                        throw new Error(`${name} evolves into unknown ${species.evolvesTo}`);
                    }
                });
                return true;
            });

            runTest('Every zone roster references real species', () => {
                Object.entries(CONFIG.ZONES).forEach(([zone, data]) => {
                    (data.monsters || []).forEach(name => {
                        if (!SPECIES[name]) throw new Error(`${zone} lists unknown ${name}`);
                    });
                });
                return true;
            });

            runTest('Type chart covers every pairing', () => {
                TYPES.forEach(a => TYPES.forEach(b => {
                    const value = TYPE_CHART[a]?.[b];
                    if (typeof value !== 'number') throw new Error(`${a} vs ${b} is missing`);
                }));
                return true;
            });

            runTest('Every monster has a usable move against every type', () => {
                // Guards against the dead matchups an all-resisted moveset creates
                const dead = [];
                DEX_ORDER.forEach(name => {
                    const species = getSpecies(name);
                    // An evolving species never exists past its evolution level
                    const cap = species.evolvesTo ? species.evolvesAt - 1 : CONFIG.MAX_LEVEL;
                    const moves = getMovesForLevel(name, cap).map(getMove);
                    TYPES.forEach(defenderType => {
                        const best = Math.max(...moves
                            .filter(m => m.power > 0)
                            .map(m => getTypeMultiplier(m.type, defenderType)));
                        if (best < 1) dead.push(`${name} vs ${defenderType}`);
                    });
                });
                if (dead.length) return `No neutral option: ${dead.slice(0, 3).join(', ')}`;
                return true;
            });

            runTest('Every monster keeps at least two attacking moves', () => {
                const thin = [];
                DEX_ORDER.forEach(name => {
                    const species = getSpecies(name);
                    const cap = species.evolvesTo ? species.evolvesAt - 1 : CONFIG.MAX_LEVEL;
                    const attacks = getMovesForLevel(name, cap).map(getMove).filter(m => m.power > 0);
                    if (attacks.length < 2) thin.push(`${name} (${attacks.length})`);
                });
                if (thin.length) return `Too few attacks: ${thin.join(', ')}`;
                return true;
            });
        }

        // World Tests
        function testWorld() {
            currentSection = document.getElementById('world-tests');
            
            runTest('WorldMap class exists', () => {
                if (typeof WorldMap === 'undefined') throw new Error('WorldMap not defined');
                return true;
            });

            runTest('Every map builds without error', () => {
                Object.keys(MAPS).forEach(id => {
                    const map = new WorldMap(id);
                    if (map.tiles.length !== map.worldHeight) {
                        throw new Error(`${id} height mismatch`);
                    }
                });
                return true;
            });

            runTest('Map generation is deterministic', () => {
                const a = new WorldMap('route_1');
                const b = new WorldMap('route_1');

                for (let y = 0; y < a.worldHeight; y++) {
                    for (let x = 0; x < a.worldWidth; x++) {
                        if (a.tiles[y][x].type !== b.tiles[y][x].type) {
                            return `Route 1 differs at ${x},${y} between visits`;
                        }
                    }
                }
                return true;
            });

            runTest('Every exit leads somewhere, and back again', () => {
                Object.entries(MAPS).forEach(([id, def]) => {
                    def.exits.forEach(exit => {
                        const target = MAPS[exit.to];
                        if (!target) throw new Error(`${id} exits to unknown ${exit.to}`);

                        const back = target.exits.find(e => e.to === id);
                        if (!back) throw new Error(`${exit.to} has no way back to ${id}`);
                        if (back.side !== OPPOSITE_SIDE[exit.side]) {
                            throw new Error(`${id}/${exit.to} exits do not face each other`);
                        }
                    });
                });
                return true;
            });

            runTest('Every exit is reachable from the map spawn', () => {
                // Flood fill from the spawn; a route whose exit is walled off
                // would strand the player.
                const blocked = [];

                Object.keys(MAPS).forEach(id => {
                    const map = new WorldMap(id);
                    const spawn = map.getDefaultSpawn();
                    const start = {
                        x: Math.floor(spawn.x / CONFIG.TILE_SIZE),
                        y: Math.floor(spawn.y / CONFIG.TILE_SIZE)
                    };

                    const seen = new Set([`${start.x},${start.y}`]);
                    const queue = [start];

                    while (queue.length) {
                        const { x, y } = queue.shift();
                        [[0,1],[0,-1],[1,0],[-1,0]].forEach(([dx, dy]) => {
                            const nx = x + dx;
                            const ny = y + dy;
                            const key = `${nx},${ny}`;
                            if (seen.has(key) || !map.inBounds(nx, ny)) return;
                            if (WorldMap.SOLID_TILES.has(map.tiles[ny][nx].type)) return;
                            seen.add(key);
                            queue.push({ x: nx, y: ny });
                        });
                    }

                    map.exits.forEach(exit => {
                        if (!seen.has(`${exit.x},${exit.y}`)) {
                            blocked.push(`${id} -> ${exit.to}`);
                        }
                    });
                });

                if (blocked.length) return `Unreachable exits: ${[...new Set(blocked)].join(', ')}`;
                return true;
            });

            runTest('Towns are safe and have a healer and a shop', () => {
                Object.entries(MAPS).filter(([, def]) => def.kind === 'town').forEach(([id, def]) => {
                    const roles = (def.npcs || []).map(n => n.role);
                    if (!roles.includes('heal')) throw new Error(`${id} has no healer`);
                    if (!roles.includes('shop')) throw new Error(`${id} has no shop`);

                    const map = new WorldMap(id);
                    const encounterTiles = map.tiles.flat().filter(t => t.encounter);
                    if (encounterTiles.length) throw new Error(`${id} has wild encounters`);
                });
                return true;
            });

            runTest('Every hidden item sits somewhere you can stand', () => {
                const stuck = [];
                Object.keys(MAPS).forEach(id => {
                    const map = new WorldMap(id);
                    map.items.forEach(item => {
                        if (map.isCollidable(item.x, item.y)) stuck.push(`${id} ${item.item}`);
                        if (!CONFIG.ITEMS[item.item]) throw new Error(`${id}: unknown item ${item.item}`);
                    });
                });
                if (stuck.length) return `Unreachable pickups: ${stuck.join(', ')}`;
                return true;
            });

            runTest('Every hidden item is reachable from the spawn', () => {
                const stranded = [];
                Object.keys(MAPS).forEach(id => {
                    const map = new WorldMap(id);
                    if (!map.items.length) return;

                    const spawn = map.getDefaultSpawn();
                    const start = {
                        x: Math.floor(spawn.x / CONFIG.TILE_SIZE),
                        y: Math.floor(spawn.y / CONFIG.TILE_SIZE)
                    };
                    const seen = new Set([`${start.x},${start.y}`]);
                    const queue = [start];

                    while (queue.length) {
                        const { x, y } = queue.shift();
                        [[0,1],[0,-1],[1,0],[-1,0]].forEach(([dx, dy]) => {
                            const nx = x + dx, ny = y + dy, key = `${nx},${ny}`;
                            if (seen.has(key) || !map.inBounds(nx, ny)) return;
                            if (WorldMap.SOLID_TILES.has(map.tiles[ny][nx].type)) return;
                            seen.add(key);
                            queue.push({ x: nx, y: ny });
                        });
                    }

                    map.items.forEach(item => {
                        if (!seen.has(`${item.x},${item.y}`)) stranded.push(`${id} ${item.item}`);
                    });
                });
                if (stranded.length) return `Walled-off pickups: ${stranded.join(', ')}`;
                return true;
            });

            runTest('Trainers with sight face a direction and can see', () => {
                Object.keys(MAPS).forEach(id => {
                    const map = new WorldMap(id);
                    map.npcs.filter(n => n.sight > 0).forEach(npc => {
                        if (!npc.facing) throw new Error(`${id}: ${npc.id} has sight but no facing`);
                        if (!npc.trainer) throw new Error(`${id}: ${npc.id} has sight but is not a trainer`);
                        if (map.tilesInFront(npc).length === 0) {
                            throw new Error(`${id}: ${npc.id} is staring straight into a wall`);
                        }
                    });
                });
                return true;
            });

            runTest('The rival chain runs in order', () => {
                const rivals = Object.entries(MAPS)
                    .flatMap(([id, def]) => (def.npcs || [])
                        .filter(n => n.rivalStage)
                        .map(n => ({ map: id, ...n })))
                    .sort((a, b) => a.rivalStage - b.rivalStage);

                if (rivals.length < 2) return 'Fewer than two rival meetings';
                if (rivals[0].requires) return 'The first meeting should not be gated';

                for (let i = 1; i < rivals.length; i++) {
                    const expected = `${rivals[i - 1].map}:${rivals[i - 1].id}`;
                    if (rivals[i].requires !== expected) {
                        return `Stage ${rivals[i].rivalStage} requires ${rivals[i].requires}, expected ${expected}`;
                    }
                    const prevTop = Math.max(...rivals[i - 1].trainer.team.map(t => t[1]));
                    const thisTop = Math.max(...rivals[i].trainer.team.map(t => t[1]));
                    if (thisTop <= prevTop) return `Stage ${rivals[i].rivalStage} is not stronger than the last`;
                }
                return true;
            });

            runTest('Wandering NPCs stay in reach of where they started', () => {
                Object.keys(MAPS).forEach(id => {
                    const map = new WorldMap(id);
                    map.npcs.filter(n => n.wander).forEach(npc => {
                        if (npc.homeX === undefined || npc.homeY === undefined) {
                            throw new Error(`${id}: ${npc.id} has no home tile`);
                        }
                        if (npc.wander < 1 || npc.wander > 4) {
                            throw new Error(`${id}: ${npc.id} wanders too far (${npc.wander})`);
                        }
                    });
                });
                return true;
            });

            runTest('Trainer teams use real species and sane levels', () => {
                Object.entries(MAPS).forEach(([id, def]) => {
                    (def.npcs || []).filter(n => n.trainer).forEach(npc => {
                        const band = def.levels || [1, 50];
                        // The rival is deliberately ahead of the local curve
                        const slack = npc.rivalStage ? 12 : 3;
                        npc.trainer.team.forEach(([name, level]) => {
                            if (!SPECIES[name]) throw new Error(`${id}: unknown ${name}`);
                            if (level < band[0] - 1 || level > band[1] + slack) {
                                throw new Error(`${id}: ${name} at ${level} is outside the route band ${band}`);
                            }
                        });
                    });
                });
                return true;
            });
        }

        // Entity Tests
        function testEntities() {
            currentSection = document.getElementById('entity-tests');
            
            runTest('Monster class exists', () => {
                if (typeof Monster === 'undefined') throw new Error('Monster class not defined');
                return true;
            });
            
            runTest('Player class exists', () => {
                if (typeof Player === 'undefined') throw new Error('Player class not defined');
                return true;
            });
            
            runTest('Monster stats are valid', () => {
                const monster = new Monster('Slime', 1, true);
                if (!monster.name || !monster.level || !monster.hp) throw new Error('Monster missing properties');
                if (monster.type !== getSpecies('Slime').type) return 'Type does not match the species';
                return true;
            });

            runTest('Monsters level up, learn moves and evolve', () => {
                const monster = new Monster('Slime', 15);
                let evolved = false;
                for (let i = 0; i < 30 && monster.level < 20; i++) {
                    monster.gainExp(monster.expToLevel).forEach(e => {
                        if (e.kind === 'evolved') evolved = true;
                    });
                }
                if (!evolved) return 'Slime never evolved by level 20';
                if (monster.name !== 'Oozer') return `Evolved into ${monster.name}`;
                if (monster.moves.length > 4) return 'Kept more than four moves';
                return true;
            });

            runTest('Route level bands climb along the route chain', () => {
                const bands = ['route_1', 'route_2', 'route_3', 'ember_cave', 'dust_road']
                    .map(id => getMapDef(id).levels);

                for (let i = 1; i < bands.length; i++) {
                    if (bands[i][0] <= bands[i - 1][0]) {
                        return `Band ${i} (${bands[i]}) does not climb past ${bands[i - 1]}`;
                    }
                }
                return true;
            });

            runTest('Route 1 is winnable with the starting team', () => {
                const starters = [new Monster('Slime', 6), new Monster('Rat', 6)];
                const [min, max] = getMapDef('route_1').levels;

                if (max > starters[0].level) {
                    return `Route 1 tops out at ${max}, above the level ${starters[0].level} starter`;
                }
                if (min < 2) return 'Route 1 monsters are below level 2';
                return true;
            });
        }

        // Battle System Tests
        function testBattle() {
            currentSection = document.getElementById('battle-tests');
            
            runTest('BattleSystem class exists', () => {
                if (typeof BattleSystem === 'undefined') throw new Error('BattleSystem not defined');
                return true;
            });
            
            runTest('BattleSystem can be instantiated', () => {
                const scene = { events: { emit: () => {} }, time: { now: 0, delayedCall: () => {} } };
                const battle = new BattleSystem(scene);
                if (!battle) throw new Error('Could not create BattleSystem');
                return true;
            });
            
            runTest('Monster can take damage', () => {
                const monster = new Monster('Slime', 5, true);
                const oldHp = monster.hp;
                monster.takeDamage(10);
                if (monster.hp >= oldHp) return 'HP did not decrease after damage';
                return true;
            });
            
            runTest('Monster can heal', () => {
                const monster = new Monster('Slime', 5, true);
                monster.takeDamage(10);
                const oldHp = monster.hp;
                monster.heal(5);
                if (monster.hp <= oldHp) return 'HP did not increase after healing';
                return true;
            });

            runTest('Status effects apply and wear off', () => {
                const monster = new Monster('Slime', 10, true);
                if (!monster.applyStatus('poison')) return 'Could not apply poison';
                if (monster.applyStatus('burn')) return 'Allowed a second status';
                const before = monster.hp;
                monster.applyEndOfTurnStatus();
                if (monster.hp >= before) return 'Poison did no damage';
                return true;
            });

            runTest('Turn order follows priority, then speed', () => {
                const scene = { events: { emit: () => {} }, time: { delayedCall: () => {} } };
                const battle = new BattleSystem(scene);

                const slow = new Monster('Golem', 20);
                const fast = new Monster('Bat', 20);
                if (fast.effectiveSpeed() <= slow.effectiveSpeed()) return 'Bat is not faster than Golem';

                const tackle = getMove('Tackle');
                if (battle.playerMovesFirst(slow, tackle, fast, tackle)) {
                    return 'The slower monster moved first';
                }
                if (!battle.playerMovesFirst(slow, getMove('Quick Jab'), fast, tackle)) {
                    return 'Priority did not beat speed';
                }
                return true;
            });

            runTest('Paralysis halves speed', () => {
                const monster = new Monster('Bat', 20);
                const before = monster.effectiveSpeed();
                monster.applyStatus('paralysis');
                if (monster.effectiveSpeed() >= before) return 'Speed did not drop';
                return true;
            });

            runTest('Every move has PP, and stronger moves have less', () => {
                Object.entries(MOVES).forEach(([name, move]) => {
                    if (typeof move.pp !== 'number' || move.pp <= 0) {
                        throw new Error(`${name} has no usable PP`);
                    }
                });

                if (MOVES['Inferno'].pp >= MOVES['Ember'].pp) {
                    return 'The strongest Fire move is not the scarcest';
                }
                return true;
            });

            runTest('Running out of PP falls back to Struggle', () => {
                const monster = new Monster('Fox', 30);
                monster.moves.forEach(name => {
                    while (monster.hasPp(name)) monster.spendPp(name);
                });

                if (!monster.isOutOfPp()) return 'Monster still reports PP left';

                const usable = monster.getUsableMoves();
                if (usable.length !== 1 || usable[0].name !== 'Struggle') {
                    return `Offered ${usable.map(m => m.name).join(', ')} instead of Struggle`;
                }
                return true;
            });

            runTest('Resting at the nurse refills PP', () => {
                const monster = new Monster('Fox', 30);
                const move = monster.moves[0];
                while (monster.hasPp(move)) monster.spendPp(move);

                monster.fullHeal();
                if (monster.getPp(move) !== getMove(move).pp) return 'PP was not restored';
                return true;
            });

            runTest('The team can be reordered', () => {
                const scene = { add: { sprite: () => ({ setOrigin(){return this;}, setDepth(){return this;},
                    play(){return this;}, anims: {}, setPosition(){return this;} }) }, map: {} };
                const player = Object.create(Player.prototype);
                player.monsters = [new Monster('Slime', 5), new Monster('Rat', 5), new Monster('Fox', 5)];
                player.currentMonsterIndex = 0;

                if (!player.reorderMonster(2, -1)) return 'Reorder was refused';
                if (player.monsters[1].name !== 'Fox') return 'Fox did not move up';

                player.reorderMonster(1, -1);
                if (player.monsters[0].name !== 'Fox') return 'Fox did not reach the front';

                if (player.reorderMonster(0, -1)) return 'Moving past the front was allowed';
                if (player.reorderMonster(2, 1)) return 'Moving past the back was allowed';
                return true;
            });

            runTest('Every item in the shop is buyable and defined', () => {
                Object.entries(CONFIG.ITEMS).forEach(([name, item]) => {
                    if (!item.type) throw new Error(`${name} has no type`);
                    if (item.price === undefined) throw new Error(`${name} has no price`);
                });
                return true;
            });
        }

        // Inventory Tests
        function testInventory() {
            currentSection = document.getElementById('inventory-tests');
            
            runTest('Inventory class exists', () => {
                if (typeof Inventory === 'undefined') throw new Error('Inventory class not defined');
                return true;
            });
            
            runTest('Inventory can add items', () => {
                const inv = new Inventory();
                inv.addItem('Potion', 3);
                if (inv.getItemCount('Potion') !== 3) return 'Item count incorrect';
                return true;
            });
            
            runTest('Inventory can use items', () => {
                const inv = new Inventory();
                inv.addItem('Potion', 3);
                const result = inv.useItem('Potion', { healMonster: (amt) => true });
                if (!result.success) return 'Could not use item';
                if (inv.getItemCount('Potion') !== 2) return 'Item not removed after use';
                return true;
            });
            
            runTest('Inventory prevents overflow', () => {
                const inv = new Inventory();
                inv.addItem('Potion', 100);
                if (inv.getItemCount('Potion') > 99) return 'Inventory overflowed';
                return true;
            });
        }

        // UI Tests
        function testUI() {
            currentSection = document.getElementById('ui-tests');
            
            runTest('Minimap class exists', () => {
                if (typeof Minimap === 'undefined') throw new Error('Minimap class not defined');
                return true;
            });
            
            runTest('UIManager class exists', () => {
                if (typeof UIManager === 'undefined') throw new Error('UIManager class not defined');
                return true;
            });
            
            runTest('UI elements exist in HTML', () => {
                // The game markup lives in the embedded game, not in this page
                const frame = document.getElementById('game-frame');
                const doc = frame && frame.contentDocument;
                if (!doc || !doc.body || doc.readyState !== 'complete') {
                    return 'Game frame not loaded yet - re-run to check';
                }

                const required = [
                    'battle-ui', 'menu-ui', 'minimap-container',
                    'encounter-notification', 'touch-controls', 'battle-items'
                ];
                for (const id of required) {
                    if (!doc.getElementById(id)) return `Missing UI element: ${id}`;
                }
                return true;
            });
        }

        // Audio Tests
        function testAudio() {
            currentSection = document.getElementById('audio-tests');
            
            runTest('AudioManager class exists', () => {
                if (typeof AudioManager === 'undefined') throw new Error('AudioManager class not defined');
                return true;
            });
            
            runTest('AudioManager can be instantiated', () => {
                const audio = new AudioManager();
                if (!audio) throw new Error('Could not create AudioManager');
                return true;
            });
        }

        // Known Issues
        function checkKnownIssues() {
            currentSection = document.getElementById('known-issues');
            
            // Check for potential issues
            const issues = [];
            
            // Check if Phaser is loaded
            if (typeof Phaser === 'undefined') {
                issues.push('⚠️ Phaser.js not loaded in test environment (expected)');
            }
            
            // Check for missing assets
            // (We'll add these when we have actual assets)
            
            // Display issues
            issues.forEach(issue => addResult(issue, 'warn'));

            if (issues.length === 0) {
                addResult('✅ No known issues detected', 'pass');
            }
        }

        function runGameTest() {
            const frame = document.getElementById('game-frame');
            frame.style.display = 'block';
            frame.src = frame.src; // Refresh
        }

        function runAllTests() {
            // Reset results
            testResults = { total: 0, passed: 0, failed: 0, warnings: 0, issues: [] };
            updateSummary();
            
            // Clear sections
            document.getElementById('core-tests').innerHTML = '';
            document.getElementById('world-tests').innerHTML = '';
            document.getElementById('entity-tests').innerHTML = '';
            document.getElementById('battle-tests').innerHTML = '';
            document.getElementById('inventory-tests').innerHTML = '';
            document.getElementById('ui-tests').innerHTML = '';
            document.getElementById('audio-tests').innerHTML = '';
            document.getElementById('known-issues').innerHTML = '';
            
            // Load game files
            const scripts = [
                '../js/utils/MathUtils.js',
                '../js/utils/Rng.js',
                '../js/config.js',
                '../js/data/Types.js',
                '../js/data/Moves.js',
                '../js/data/Species.js',
                '../js/data/Maps.js',
                '../js/world/TileTextures.js',
                '../js/world/WorldMap.js',
                '../js/entities/Monster.js',
                '../js/entities/Player.js',
                '../js/systems/Inventory.js',
                '../js/systems/BattleSystem.js',
                '../js/systems/EncounterSystem.js',
                '../js/systems/AudioManager.js',
                '../js/utils/SpriteFactory.js',
                '../js/ui/Minimap.js',
                '../js/ui/TouchControls.js',
                '../js/ui/UIManager.js'
            ];
            
            let loaded = 0;
            const totalScripts = scripts.length;
            
            function loadNext() {
                if (loaded >= scripts.length) {
                    // All scripts loaded, run tests
                    testCore();
                    testWorld();
                    testEntities();
                    testBattle();
                    testInventory();
                    testUI();
                    testAudio();
                    checkKnownIssues();
                    return;
                }
                
                const script = document.createElement('script');
                script.src = scripts[loaded];
                script.onload = () => {
                    loaded++;
                    loadNext();
                };
                script.onerror = () => {
                    console.error(`Failed to load: ${scripts[loaded]}`);
                    loaded++;
                    loadNext();
                };
                document.head.appendChild(script);
            }
            
            loadNext();
        }

        // window 'load' fires once the embedded game frame has loaded too, so
        // the UI check has something real to inspect.
        window.addEventListener('load', () => setTimeout(runAllTests, 300));
    </script>
</body>
</html>
